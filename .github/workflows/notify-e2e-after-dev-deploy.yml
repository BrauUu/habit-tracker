name: Notify E2E after DEV deployment

on:
  repository_dispatch:
    types:
    - vercel.deployment.success

permissions:
  contents: read

jobs:
  notify-e2e:
    name: Trigger E2E tests
    if: github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger QA workflow
      env:
        GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::The QA_DISPATCH_TOKEN secret is not configured"
          exit 1
        fi

        curl --fail-with-body --request POST \
          --url https://api.github.com/repos/BrauUu/habit-tracker-qa/actions/workflows/328240552/dispatches \
          --header "Accept: application/vnd.github+json" \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "Content-Type: application/json" \
          --header "X-GitHub-Api-Version: 2026-03-10" \
          --data "{\"ref\":\"main\",\"inputs\":{\"component\":\"frontend\"}}"
