name: Notify E2E after DEV deployment

on:
  deployment_status:

permissions:
  contents: read

jobs:
  notify-e2e:
    name: Trigger E2E tests
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger QA workflow
        env:
          GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The QA_DISPATCH_TOKEN secret is not configured"
            exit 1
          fi

          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/BrauUu/habit-tracker-qa/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"dev_deployment_succeeded\",\"client_payload\":{\"component\":\"frontend\",\"sha\":\"$DEPLOYMENT_SHA\"}}"
